# gitleaks configuration for scripts/ci/secret-scan.sh: the built-in rules plus one narrow allowlist.
title = "sunnycloud gitleaks"

[extend]
useDefault = true

# Task ids such as AZ-3769_contracts_part2 in the "Dependencies:" lines of _docs/02_tasks/*.md have the shape of an
# API key to the generic rule. The allowlist is limited to that rule and to values that are exactly a task id.
[[allowlists]]
description = "Jira task ids in task dependency lists"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^AZ-\d+_[a-z0-9_]+$''']

# Test fixtures with made-up values: a redaction test plants token-shaped strings on purpose, and the tree and sharing
# tests use base64 of "wrapped-1" and a dummy secret, and the three share tests of the web app plant one made-up share
# token (`sc_shr_` plus random-looking text) as their TOKEN constant. The allowlist names the files and the generic rule only.
[[allowlists]]
description = "Planted fake secrets of three test files"
targetRules = ["generic-api-key"]
paths = [
    '''src/shared/observability/tests/logging_redaction\.rs''',
    '''src/components/02_tree/tests/tree/vault_moves\.rs''',
    '''src/components/06_sharing/tests/sharing/config\.rs''',
    '''src/web/src/lib/shares/address\.test\.ts''',
    '''src/web/src/pages/SharePublicPage\.test\.ts''',
    '''src/web/src/pages/files/ShareDialog\.test\.ts''',
]
