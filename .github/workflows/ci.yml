# PR gate (AZ-3761). YAML only checks out, caches and calls repository scripts (scripts/ci/*.sh); the same
# scripts run on a laptop. Every action is pinned by commit SHA, the PostgreSQL service by digest.
name: ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: ${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock', 'src/Cargo.toml') }}
          cache-on-failure: true
      - name: Install sqlx-cli
        run: scripts/ci/watchdog.sh --name install-tools -- scripts/ci/install-tools.sh sqlx-cli
      - name: fmt, clippy, offline query data
        run: scripts/ci/watchdog.sh --name rust-lint -- scripts/ci/rust-lint.sh

  # The workspace tests run in 6 parts on their own runners (every part compiles the whole workspace, 4 minutes, and runs a
  # sixth of the tests); the `coverage` job merges their lcov files and applies the gate. Leg `features` runs the two
  # feature builds of the server that the workspace run leaves off.
  rust-test:
    name: rust-test (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        include:
          - shard: features
    services:
      postgres:
        image: postgres:18-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # pg_dump and pg_restore of the restore pipeline tests (AZ-3666), installed below.
      SC_PG_TOOLS: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      # Cargo.toml holds the dev profile (optimised dependencies): a cache saved under a key is never overwritten, so a
      # profile change needs a new key or every run rebuilds the dependencies. Leg `features` builds other targets, so
      # it saves its own cache: the first leg to finish would otherwise fix the content of the shared one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: ${{ matrix.shard == 'features' && 'features-' || '' }}${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock', 'src/Cargo.toml') }}
          cache-on-failure: true
      - name: Install cargo-llvm-cov and cargo-nextest
        run: scripts/ci/watchdog.sh --name install-tools -- scripts/ci/install-tools.sh cargo-llvm-cov cargo-nextest
      - name: Install the PostgreSQL 18 client (PGDG, pinned version and key)
        run: scripts/ci/watchdog.sh --name install-pg-client -- scripts/ci/install-tools.sh pg-client-18
      # The daemon's token_keyring tests start a real gnome-keyring on a private session bus.
      - name: Install gnome-keyring, secret-tool and dbus
        run: scripts/ci/watchdog.sh --name install-keyring -- scripts/ci/install-tools.sh keyring-test-deps
      - name: cargo llvm-cov nextest, one sixth of the workspace tests
        if: matrix.shard != 'features'
        # The instrumented workspace compile and link prints nothing for minutes (the 120 s default stalled it).
        env:
          WATCHDOG_STALL: 600
          COVERAGE_PARTITION: ${{ matrix.shard }}/6
          COVERAGE_LCOV_OUT: ${{ runner.temp }}/coverage-${{ matrix.shard }}.lcov
        run: scripts/ci/watchdog.sh --name rust-test -- scripts/ci/check-coverage.sh
      - name: Keep the coverage of this part
        if: matrix.shard != 'features'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-${{ matrix.shard }}.lcov
          retention-days: 3
          if-no-files-found: error
      # The vault service (v1.2) is linked only with feature `vault`, which the workspace run leaves off.
      - name: Server tests with the vault feature
        if: matrix.shard == 'features'
        working-directory: src
        env:
          WATCHDOG_STALL: 600
        run: >-
          ../scripts/ci/watchdog.sh --name rust-test-vault -- cargo test --locked -p sunnycloud-server --features vault
          --test vault_http --test vault_report --test local_commands --test api_services --test composition_root
      # The -test images build `serve` with feature `test-clock` (AZ-4334): one OffsetClock moved through :9091.
      - name: Server tests with the test-clock feature
        if: matrix.shard == 'features'
        working-directory: src
        env:
          WATCHDOG_STALL: 600
        run: >-
          ../scripts/ci/watchdog.sh --name rust-test-test-clock -- cargo test --locked -p sunnycloud-server
          --features test-clock --test test_clock_serve --test pipeline_gc_retention --test api_services --test composition_root

  # The gate on the lcov files of the 6 parts: line coverage 75% overall, 90% on the critical paths. No Rust needed.
  coverage:
    needs: rust-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: ${{ runner.temp }}/lcov
      - name: Merge the coverage of the parts and apply the gate
        env:
          COVERAGE_LCOV_DIR: ${{ runner.temp }}/lcov
        run: scripts/ci/watchdog.sh --name coverage -- scripts/ci/check-coverage.sh

  # The three 1 GiB ACs (AZ-3657 AC-1, AZ-3660 AC-72, AZ-3758 AC-3) in release mode, apart from the instrumented rust-test
  # job (owner decision 2026-11-18). Each runs by its exact name, so no other ignored test runs here; run-one-test.sh
  # fails the step unless exactly one test passed (a name that matches nothing would otherwise pass silently).
  pipelines-large:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: ${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock') }}-release
          cache-on-failure: true
      - name: 1 GiB download (AZ-3657 AC-1)
        working-directory: src
        run: ../scripts/ci/watchdog.sh --name pipeline-download-1gib -- ../scripts/ci/run-one-test.sh cargo test --release --locked -p sunnycloud-server --test pipeline_download -- --ignored --exact ac1_a_1_gib_file_reads_in_full_by_range_past_the_end_and_conditionally
      - name: 1 GiB range abuse stays bounded (AZ-3758 AC-3)
        working-directory: src
        run: ../scripts/ci/watchdog.sh --name range-memory-1gib -- ../scripts/ci/run-one-test.sh cargo test --release --locked -p sunnycloud-transfer --test range_memory -- --ignored --exact range_abuse_on_a_one_gib_file_answers_one_full_stream_and_stays_bounded
      - name: 1 GiB worker input (AZ-3660 AC-72)
        working-directory: src
        run: ../scripts/ci/watchdog.sh --name pipeline-worker-1gib -- ../scripts/ci/run-one-test.sh cargo test --release --locked -p sunnycloud-server --test pipeline_media_worker -- --ignored --exact ac72_the_worker_input_of_a_1_gib_file_hashes_to_its_plaintext_block_by_block

  # AZ-3835 AC-1: the IT-11 cases of components/11_http_api/tests.md, each with its result, duration and budget.
  # 11 holds no SQL (Mode S stub services), so the job needs no database.
  http-api-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: ${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock', 'src/Cargo.toml') }}
          cache-on-failure: true
      - name: IT-11-1 to IT-11-20 with their max execution times and the missing-case check
        run: scripts/ci/watchdog.sh --name http-api-suite -- scripts/ci/check-it-suite.sh

  pg18-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: ${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock', 'src/Cargo.toml') }}
          cache-on-failure: true
      - name: Install sqlx-cli
        run: scripts/ci/watchdog.sh --name install-tools -- scripts/ci/install-tools.sh sqlx-cli
      - name: Migrations up, down, up on an empty PostgreSQL 18
        run: scripts/ci/watchdog.sh --name pg18-migrations -- scripts/ci/check-migrations.sh

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinning check (actions, images, permissions)
        run: scripts/ci/watchdog.sh --name check-pinning -- scripts/ci/check-pinning.sh
      - name: Licence files
        run: scripts/ci/watchdog.sh --name check-licence -- scripts/ci/check-licence.sh
      - name: No SQL now() in SQL files or query strings
        run: scripts/ci/watchdog.sh --name check-no-sql-now -- scripts/ci/check-no-sql-now.sh
      - name: Scope settings only in sc_db, run_system allowlist, SQL text in repository modules
        run: scripts/ci/watchdog.sh --name check-db-gates -- scripts/ci/check-db-gates.sh
      - name: audit_log statements limited to the audit crate's insert, export select and purge call
        run: scripts/ci/watchdog.sh --name check-audit-sql -- scripts/ci/check-audit-sql.sh
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: ${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock', 'src/Cargo.toml') }}
          cache-on-failure: true
      - name: Install cargo-deny, cargo-audit and gitleaks
        run: scripts/ci/watchdog.sh --name install-tools -- scripts/ci/install-tools.sh cargo-deny cargo-audit gitleaks
      - name: Advisory ignores, cargo audit, cargo deny check advisories bans licenses sources
        run: scripts/ci/watchdog.sh --name audit -- scripts/ci/audit.sh
      - name: wasm32 build of sync-core-wasm and sc_ids
        run: scripts/ci/watchdog.sh --name build-wasm -- scripts/ci/build-wasm.sh
      - name: Secret scan (gitleaks, full history)
        run: scripts/ci/watchdog.sh --name secret-scan -- scripts/ci/secret-scan.sh
      - name: Tests of the CI scripts
        run: scripts/ci/watchdog.sh --name script-tests -- scripts/ci/tests/run-script-tests.sh

  # One leg per image: the five builds are independent, and api and api-test alone take 4 minutes each.
  image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, decoder, api-test, worker-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The cook layer hangs on the recipe, which holds every Cargo.toml: a manifest change needs a new key, because
      # actions/cache never overwrites an existing one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: buildx-${{ matrix.target }}-${{ hashFiles('src/Cargo.lock', 'src/rust-toolchain.toml', 'src/**/Cargo.toml', 'deploy/docker/*.Dockerfile') }}
          restore-keys: buildx-${{ matrix.target }}-
      - name: Build ${{ matrix.target }} (no push)
        env:
          BUILDX_CACHE_DIR: ${{ runner.temp }}/buildx-cache
        run: >-
          scripts/ci/watchdog.sh --name build-image-${{ matrix.target }} --
          scripts/ci/build-images.sh build ${{ matrix.target }} ${{ runner.temp }}/${{ matrix.target }}.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ matrix.target }}.tar
          retention-days: 1
          if-no-files-found: error

  images:
    needs: image-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Load the five images
        run: for tar in "${RUNNER_TEMP}"/images/*.tar; do docker load --input "$tar"; done
      - name: Users, labels, health checks and layers of the five images
        run: scripts/ci/watchdog.sh --name check-images -- scripts/ci/build-images.sh check
      - name: Release api and worker images contain no test-clock symbol
        run: >-
          scripts/ci/watchdog.sh --name check-release-symbols -- scripts/ci/check-release-symbols.sh
          --image sunnycloud-api:ci /usr/local/bin/sunnycloud
          --image sunnycloud-worker:ci /usr/local/bin/sunnycloud-worker

  # v1.2 only (E-29, AZ-4007): the vault-core matrix (native, WASM, UniFFI). No v1.0 or v1.1 release build runs
  # or links vault-core (ADR-016, FT-P-73); this PR gate job builds nothing that ships.
  vault-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [native, wasm, uniffi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: vault-core-${{ matrix.leg }}-${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock', 'src/Cargo.toml') }}
          cache-on-failure: true
      - name: Install cargo-deny
        if: matrix.leg == 'native'
        run: scripts/ci/watchdog.sh --name install-tools -- scripts/ci/install-tools.sh cargo-deny
      - name: vault-core ${{ matrix.leg }} leg
        run: scripts/ci/watchdog.sh --name vault-core-${{ matrix.leg }} -- src/vault-core/ci/vault-core-ci.sh ${{ matrix.leg }}
      - name: cargo deny licence allowlist of the iOS build graph
        if: matrix.leg == 'native'
        run: scripts/ci/watchdog.sh --name vault-core-licences -- src/vault-core/ci/vault-core-ci.sh licences
      - name: Swift leg (NOT-RUN(H-MAC) without the owner Mac; blocks only the release gate)
        if: matrix.leg == 'uniffi'
        run: scripts/ci/watchdog.sh --name vault-core-swift -- src/vault-core/ci/vault-core-ci.sh swift

  # E-27/c18 (AZ-4002): the Android app and its native library. Rust library per ABI (NDK r28), v1.0 links no
  # vault-core, Kotlin binding drift, debug and release builds with the 16 KB alignment check on every packaged library,
  # Flutter and Kotlin unit tests, then the seeded failures that prove each gate can fail. Versions are pinned in
  # scripts/ci/mobile-common.sh. The emulator harness is E-27/c19 and is not part of this job.
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: mobile-${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock', 'src/Cargo.toml') }}
          cache-on-failure: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: mobile-gradle-${{ hashFiles('src/mobile/pubspec.lock', 'src/mobile/android/**/*.kts', 'src/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      # The Flutter archive is 1.5 GB and the download prints nothing, so this one step gets a longer quiet limit.
      - name: Install Flutter and the Android SDK packages (pinned versions, SHA-256 verified)
        run: WATCHDOG_STALL=600 scripts/ci/watchdog.sh --name mobile-setup -- scripts/ci/mobile-setup.sh
      - name: Rust library per ABI (mobile_backup with feature uniffi, release, NDK r28)
        run: scripts/ci/watchdog.sh --name mobile-build-native -- scripts/ci/mobile-build-native.sh
      - name: v1.0 Android build links no vault-core
        run: scripts/ci/watchdog.sh --name mobile-check-no-vault -- scripts/ci/mobile-check-no-vault.sh
      - name: Kotlin bindings match the Rust surface
        run: scripts/ci/watchdog.sh --name mobile-check-bindings -- scripts/ci/mobile-check-bindings.sh
      - name: Debug build, minSdk, one process, one library per ABI, 16 KB alignment
        run: scripts/ci/watchdog.sh --name mobile-build-debug -- scripts/ci/mobile-build-app.sh debug
      - name: Release build, minSdk, one process, one library per ABI, 16 KB alignment
        run: scripts/ci/watchdog.sh --name mobile-build-release -- scripts/ci/mobile-build-app.sh release
      - name: flutter analyze, flutter test, Kotlin unit tests (BackupCore.status without a server)
        run: scripts/ci/watchdog.sh --name mobile-test -- scripts/ci/mobile-test.sh
      - name: Seeded failures (4 KB library, changed BackupCore method, vault-core dependency)
        run: scripts/ci/watchdog.sh --name mobile-check-seeds -- scripts/ci/tests/test-mobile-checks.sh

  # AZ-3935: the web app (src/web). Bun 1.4.5 installs and runs the scripts; the runner's Node (22 or newer) runs vite,
  # vitest, eslint and svelte-check. Lint, typecheck, unit tests (they include a scan of a real production build for
  # inline scripts and foreign URLs, the CSP of the deployment), the production build, client drift against the OpenAPI
  # snapshot, bun audit. The Worker's sync-core-wasm is built first (wasm-pack). Steps live in src/web/ci/web-ci.sh.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: scripts/ci/watchdog.sh --name setup-rust -- scripts/ci/setup-rust.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: web-${{ hashFiles('src/rust-toolchain.toml', 'src/Cargo.lock', 'src/Cargo.toml') }}
          cache-on-failure: true
      # Bun installs packages and runs the scripts, but hands the tools' node-shebang bins (vite, vitest, eslint) to Node,
      # so Node 22 is pinned here instead of relying on what the runner image ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install bun and wasm-pack
        run: scripts/ci/watchdog.sh --name install-tools -- scripts/ci/install-tools.sh bun wasm-pack
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
