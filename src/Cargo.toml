[workspace]
resolver = "3"
members = [
    "shared/config",
    "shared/error",
    "shared/clock",
    "shared/audit",
    "shared/ids_hashing",
    "shared/names",
    "shared/db",
    "shared/ratelimit",
    "shared/observability",
    "contracts",
    "media-shared",
    "components/01_identity",
    "components/02_tree",
    "components/03_transfer",
    "components/04_blobstore",
    "components/05_sync_feed",
    "components/06_sharing",
    "components/07_admin",
    "components/07a_quota",
    "components/08_media_jobs",
    "components/11_http_api",
    "components/20_vault_service",
    "server",
    "worker",
    "decoder",
    "sync-core",
    "sync-core-wasm",
    "desktop/ipc_schema",
    "desktop/daemon",
    "desktop/settings",
    "mobile_backup",
    "vault-core",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
axum = "=0.8.9"
hyper = "1.12"
tokio = "1.54.1"
h2 = "0.4.16"
bytes = "1.11.1"
rustls = "0.23.45"
sqlx = "0.9"
blake3 = "=1.8.7"
chacha20poly1305 = "=0.11.0"
aead-stream = "=0.6.0"
openidconnect = "=4.1.0"
oauth2 = "=5.0.0"
uniffi = "=0.32.2"
notify = "=8.2.1"
tray-icon = "=0.26.1"
slint = "=1.18.1"
rfd = "=0.17.2"
rusqlite = "=0.41.1"
reqwest = "=0.13.5"
wasm-bindgen = "=0.2.130"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", default-features = false, features = ["serde"] }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
