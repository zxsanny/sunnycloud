[package]
name = "sync-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Debug builds only: accepts an `http://` server URL and speaks h2c. A release build refuses it at compile time.
allow-plain-http = []
# Test-only entry points (extra trust roots for the scripted fake server, the request path). Enabled only by this crate's
# own dev-dependency below, so no release tree contains it; `tests/release_isolation.rs` checks that.
test-support = []
# UniFFI derives and foreign-callback host traits for `mobile_backup` (AZ-3968); off by default, so no other tree
# contains a UniFFI crate.
uniffi = ["dep:uniffi", "sync-core-proto/uniffi", "dep:jni"]

[dependencies]
uniffi = { version = "=0.32.2", default-features = false, optional = true }
sc_clock = { path = "../shared/clock" }
sc_config = { path = "../shared/config" }
sc_error = { path = "../shared/error", default-features = false, features = ["client"] }
sc_ids = { path = "../shared/ids_hashing" }
sync-core-proto = { path = "../sync-core-proto" }
bytes = { workspace = true }
getrandom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
thiserror = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["http2", "rustls-no-provider"] }
rustls = { workspace = true }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
sync-core = { path = ".", features = ["test-support"] }
sc_error = { path = "../shared/error" }
# The scripted fake server (tests/support) and its test CA live only here: dev-dependencies are never built into a release binary.
bytes = { workspace = true }
http-body-util = "0.1"
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# The Android trust-store initialisation: rustls-platform-verifier 0.7.1 takes `jni` 0.22 types (owner decision
# 2026-11-13: an exported JNI function the app calls with its Context, AZ-3968).
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false, optional = true }
