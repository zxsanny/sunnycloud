[package]
name = "sunnycloud-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sunnycloud_worker"
path = "src/lib.rs"

[[bin]]
name = "sunnycloud-worker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
media-shared = { path = "../media-shared" }
sc_config = { path = "../shared/config" }
sc_observability = { path = "../shared/observability" }
axum = { workspace = true }
rustix = { version = "1.1", features = ["fs"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { workspace = true }

[dev-dependencies]
decoder-runner = { path = "../decoder" }
rustix = { version = "1.1", features = ["fs", "process"] }
tempfile = "3"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[features]
test-clock = []
