# Settings are added only when a build proves it needs them.

# Android libraries link with 16 KB page alignment on every ABI (AZ-3985 record, 17 description section 5). NDK r28
# does it by default on the 64-bit targets only; armeabi-v7a links at 4 KB without the flag.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
