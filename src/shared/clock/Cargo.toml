[package]
name = "sc_clock"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"], optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
# Self dev-dependency: `cargo test -p sc_clock` (and the workspace test run in CI) also compiles OffsetClock.
# Dev-dependencies are never built into the release binaries.
sc_clock = { path = ".", features = ["test-clock"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[features]
default = ["runtime"]
# The clock trait, the system, manual and offset clocks and the shutdown token need tokio. Without it the
# crate keeps only the plain value types (`Timestamp`, `MonotonicInstant`), the errors and `wake_gap_exceeded`,
# so wasm32 client crates and `sc_names` stay free of an async runtime.
runtime = ["dep:tokio", "dep:tokio-util"]
test-clock = ["runtime"]
