[package]
name = "sc_ids"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sc_clock = { path = "../clock", default-features = false, features = ["runtime"], optional = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Browser builds draw randomness from crypto.getRandomValues; native targets use the OS source.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[features]
default = ["new-id"]
# `new_id` takes the injected `Clock`, which needs tokio. Client and wasm32 crates that only hash turn it off.
new-id = ["dep:sc_clock"]

[dev-dependencies]
sc_clock = { path = "../clock" }
base64 = { workspace = true }
