[package]
name = "decoder-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "decoder-runner"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Test images only (10_decoder description section 3): SIGUSR1 freezes the main loop so the
# watchdog can be shown to abort. Nothing depends on this crate, so no other build can enable it.
test-freeze = []

[dependencies]
libc = "0.2"
media-shared = { path = "../media-shared" }
sc_config = { path = "../shared/config" }
sc_observability = { path = "../shared/observability" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
