[package]
name = "sunnycloud-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sunnycloud_server"
path = "src/lib.rs"

[[bin]]
name = "sunnycloud"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
contracts = { path = "../contracts" }
sunnycloud-identity = { path = "../components/01_identity" }
sunnycloud-tree = { path = "../components/02_tree" }
sunnycloud-transfer = { path = "../components/03_transfer" }
sunnycloud-blobstore = { path = "../components/04_blobstore" }
sunnycloud-sync-feed = { path = "../components/05_sync_feed" }
sunnycloud-sharing = { path = "../components/06_sharing" }
sunnycloud-admin = { path = "../components/07_admin" }
sunnycloud-quota = { path = "../components/07a_quota" }
media-api = { path = "../components/08_media_jobs" }
sunnycloud-http-api = { path = "../components/11_http_api" }
# v1.2 only: linked with feature `vault` (module-layout exception 6, owner decision 2026-11-14).
sunnycloud-vault-service = { path = "../components/20_vault_service", optional = true }
chrono = { version = "0.4", default-features = false }
sc_audit = { path = "../shared/audit" }
sc_clock = { path = "../shared/clock" }
sc_config = { path = "../shared/config" }
sc_db = { path = "../shared/db" }
sc_error = { path = "../shared/error" }
sc_observability = { path = "../shared/observability", features = ["db"] }
sc_ratelimit = { path = "../shared/ratelimit" }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
tokio-util = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
async-trait = "0.1"
axum = { workspace = true }
# `serve`'s binary tests send real blocks, each with its `X-Blake3` hash.
sc_ids = { path = "../shared/ids_hashing" }
# Per-test PostgreSQL databases of the janitor tests; `crate_graph` bans it as a normal dependency.
sc_testdb = { path = "../shared/testdb" }
# The janitor tests read and seed their databases directly; test code only (`crate_graph` bans it as a normal dependency).
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
uuid = { workspace = true, features = ["v4"] }

[features]
test-clock = []
# v1.2 builds: the vault service (20), its erase hook and its port. Off by default, so v1.0 and v1.1 binaries
# contain no vault code.
vault = ["dep:sunnycloud-vault-service"]
