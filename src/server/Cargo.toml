[package]
name = "sunnycloud-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sunnycloud_server"
path = "src/lib.rs"

[[bin]]
name = "sunnycloud"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
contracts = { path = "../contracts" }
sunnycloud-identity = { path = "../components/01_identity" }
sunnycloud-tree = { path = "../components/02_tree" }
sunnycloud-transfer = { path = "../components/03_transfer" }
sunnycloud-blobstore = { path = "../components/04_blobstore" }
sunnycloud-sync-feed = { path = "../components/05_sync_feed" }
sunnycloud-sharing = { path = "../components/06_sharing" }
sunnycloud-admin = { path = "../components/07_admin" }
sunnycloud-quota = { path = "../components/07a_quota" }
media-api = { path = "../components/08_media_jobs" }
sunnycloud-http-api = { path = "../components/11_http_api" }
sunnycloud-vault-service = { path = "../components/20_vault_service" }
sc_clock = { path = "../shared/clock" }
sc_config = { path = "../shared/config" }
sc_error = { path = "../shared/error" }
sc_observability = { path = "../shared/observability" }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[features]
test-clock = []
