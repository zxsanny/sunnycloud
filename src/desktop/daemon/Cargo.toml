[package]
name = "sunnycloud-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sunnycloud_daemon"
path = "src/lib.rs"

[[bin]]
name = "sunnycloud-daemon"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Debug builds only (sync-core refuses it in release): accepts an `http://` server address for login.
allow-plain-http = ["sync-core/allow-plain-http"]

[dependencies]
sync-core = { path = "../../sync-core" }
sync-core-proto = { path = "../../sync-core-proto" }
sc_names = { path = "../../shared/names" }
sc_clock = { path = "../../shared/clock" }
sc_config = { path = "../../shared/config" }
bytes = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
ipc_schema = { path = "../../desktop/ipc_schema" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# v1 mode (default feature): Secret Service through zbus-secret-service-keyring-store on Linux, Credential Manager on Windows.
keyring = "=4.2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process", "rand"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
sc_error = { path = "../../shared/error", default-features = false, features = ["client"] }
tempfile = "3"
