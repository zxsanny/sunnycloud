[package]
name = "sunnycloud-sync-feed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
sc_config = { path = "../../shared/config" }
sc_db = { path = "../../shared/db" }
sc_observability = { path = "../../shared/observability" }
# Same features as sc_db: the stamp runs its statement on the transaction's connection.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Per-test PostgreSQL databases.
sc_testdb = { path = "../../shared/testdb" }
# The ERROR test installs the capturing subscriber of sc_observability on its thread; the statement test
# reads sqlx's statement events.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
