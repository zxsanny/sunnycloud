[package]
name = "sunnycloud-admin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
# The deletion deadline is read from the injected clock.
sc_clock = { path = "../../shared/clock" }
sc_audit = { path = "../../shared/audit" }
sc_config = { path = "../../shared/config" }
sc_db = { path = "../../shared/db" }
sc_error = { path = "../../shared/error" }
# The dev seed stages its photo with the block hash and ids of the shared helpers.
sc_ids = { path = "../../shared/ids_hashing" }
sc_observability = { path = "../../shared/observability" }
thiserror = { workspace = true }
# The dev seed's `stage_small` body (`ByteStream`), as in 02 and 03.
bytes = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# `time` bounds each health check, `rt` runs the checks as concurrent tasks.
tokio = { workspace = true, features = ["rt", "time"] }
uuid = { workspace = true }

[dev-dependencies]
# The account view and the deletion request run against the real 01 (account admin, guard, authenticator),
# 02 (tree reader and commit), 07a (quota view and ledger), with 04's GC queue and 05's feed stamp under the
# commit (component dev-dependencies, ADR-015).
sunnycloud-identity = { path = "../01_identity" }
sunnycloud-tree = { path = "../02_tree" }
sunnycloud-blobstore = { path = "../04_blobstore" }
sunnycloud-sync-feed = { path = "../05_sync_feed" }
sunnycloud-quota = { path = "../07a_quota" }
# The dev seed runs against the real 03 upload and commit service and 06 share service, with 01's sign-in
# limiter (AZ-3822).
sunnycloud-transfer = { path = "../03_transfer" }
sunnycloud-sharing = { path = "../06_sharing" }
sc_ratelimit = { path = "../../shared/ratelimit" }
# 01's in-process identity provider (its `tests/support/provider.rs`, standing in for mock-idp) serves OIDC on a
# local socket and signs ES256 id tokens.
base64 = { workspace = true }
reqwest = { workspace = true }
ring = "0.17"
serde_json = { workspace = true }
# Per-test PostgreSQL databases.
sc_testdb = { path = "../../shared/testdb" }
# The port doubles of the tests run their statements on the transaction's connection; same features as sc_db.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
# The purger's log tests install a capturing subscriber, as 02's and 05's do.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# `test-util` gives the health tests a virtual clock.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
uuid = { workspace = true, features = ["v4"] }
