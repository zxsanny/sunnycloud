[package]
name = "sunnycloud-sharing"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
sc_config = { path = "../../shared/config" }

[dev-dependencies]
# The component's connection pool and the manual clock of the harness.
sc_clock = { path = "../../shared/clock" }
sc_db = { path = "../../shared/db" }
# The AbuseLimiter the later suites build per test.
sc_ratelimit = { path = "../../shared/ratelimit" }
# Per-test PostgreSQL databases.
sc_testdb = { path = "../../shared/testdb" }
# The tests read and write the tables with plain statements on the transaction's connection.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true, features = ["v4"] }
