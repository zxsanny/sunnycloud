[package]
name = "sunnycloud-blobstore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
sc_audit = { path = "../../shared/audit" }
sc_config = { path = "../../shared/config" }
sc_db = { path = "../../shared/db" }
# Seals and opens the chunks; the cipher failure of the wrap and chunk AEADs is what the conversions accept.
chacha20poly1305 = { workspace = true, features = ["zeroize"] }
# Per-blob data keys and nonce prefixes.
getrandom = { workspace = true }
# The keyring repository module runs its statements on the transaction's connection; same features as sc_db.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
thiserror = { workspace = true }
# The group flush runs on the blocking pool; waiters sleep on a notification. `fs` reads the key files and the
# key check and walks the blob folder.
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
# INFO "startup key check passed" and ERROR on a failed unwrap, through the typed log macros.
sc_observability = { path = "../../shared/observability" }
uuid = { workspace = true }
# Data keys and master keys are wiped on drop; `alloc` wipes the read buffers and unwrapped plaintexts.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[features]
# Test-only fault hook around the group sync (block, fail, count). Enabled only by this crate's own dev-dependency
# below, so no release tree contains it; `tests/barrier/release.rs` checks that.
sync-hook = []

[dev-dependencies]
# Self dev-dependency: `cargo test -p sunnycloud-blobstore` compiles the hook. Dev-dependencies are never built
# into the release binaries.
sunnycloud-blobstore = { path = ".", features = ["sync-hook"] }
# Test oracle only: the sequential STREAM encryptor the hand-built nonces are compared with.
aead-stream = { workspace = true, features = ["alloc"] }
# The log test installs the capturing subscriber of sc_observability on its thread.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Per-test PostgreSQL databases.
sc_testdb = { path = "../../shared/testdb" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true, features = ["v4"] }
