[package]
name = "sunnycloud-identity"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
sc_clock = { path = "../../shared/clock" }
sc_config = { path = "../../shared/config" }
sc_db = { path = "../../shared/db" }
sc_error = { path = "../../shared/error" }
sc_ids = { path = "../../shared/ids_hashing" }
# The id-token verifier reads time from the injected clock, in chrono's type.
chrono = { version = "0.4", default-features = false }
# The successor pair of a refresh rotation is sealed with the workspace AEAD, the key derived with SHA-256.
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
# No bundled HTTP client: provider calls go through the guarded client of `outbound`.
oauth2 = { workspace = true }
openidconnect = { workspace = true }
# TLS as in sync-core: rustls with the ring provider and the platform verifier.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true }
rustls-platform-verifier = "0.7.1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Same features as sc_db: the repository module runs its statements on the transaction's connection.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The statement-capture subscriber of the harness reads sqlx's statement events.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
# The in-process provider signs its id tokens (ES256) with a generated key.
base64 = { workspace = true }
ring = "0.17"
