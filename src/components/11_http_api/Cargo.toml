[package]
name = "sunnycloud-http-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
sc_clock = { path = "../../shared/clock" }
sc_error = { path = "../../shared/error" }
sc_ids = { path = "../../shared/ids_hashing" }
sc_observability = { path = "../../shared/observability" }
axum = { workspace = true }
hyper = { workspace = true }
http-body-util = "0.1"
serde_json = { workspace = true }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
# Same spec as sc_observability: `Instrument` carries the request span across awaits.
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { workspace = true }

[features]
# Adds the `OffsetClock` handle to `ApiServices`, the clock-offset route on the internal listener and the
# `:9091` test-clock listener.
test-clock = ["sc_clock/test-clock"]

[dev-dependencies]
# The device-login end-to-end test (AZ-4231 AC-4): the real client against these routes behind a test TLS
# terminator. A server crate may dev-depend on a client crate; the reverse is refused by the crate-graph check.
sync-core = { path = "../../sync-core", features = ["test-support"] }
sync-core-proto = { path = "../../sync-core-proto" }
sc_config = { path = "../../shared/config" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
futures-core = { version = "0.3", default-features = false }
prometheus-parse = "0.2"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
