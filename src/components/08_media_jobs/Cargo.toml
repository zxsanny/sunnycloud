[package]
name = "media-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
media-shared = { path = "../../media-shared" }
sc_clock = { path = "../../shared/clock" }
sc_config = { path = "../../shared/config" }
sc_db = { path = "../../shared/db" }
sc_error = { path = "../../shared/error" }
# `new_id` for the job ids; `FileHash` of the claimed job.
sc_ids = { path = "../../shared/ids_hashing" }
sc_observability = { path = "../../shared/observability" }
# The repository module runs its statements on the transaction's connection; same features as sc_db.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The real `TreeCommit::publish` (02) with its quota ledger (07a) and feed stamp (05) for the rollback case of
# the tree-commit contract (component dev-dependencies, ADR-015).
sunnycloud-tree = { path = "../02_tree" }
sunnycloud-quota = { path = "../07a_quota" }
# The real 04 blob catalog and reader for the derived opener (AZ-3844).
sunnycloud-blobstore = { path = "../04_blobstore" }
# Writing and reading back a real derived blob through 04 (keyring audit writer, `Bytes` blocks, the read stream).
sc_audit = { path = "../../shared/audit" }
bytes = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
sunnycloud-sync-feed = { path = "../05_sync_feed" }
# Per-test PostgreSQL databases.
sc_testdb = { path = "../../shared/testdb" }
# The boundary-backed `AccountGuard` double (AZ-4250).
sunnycloud-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
