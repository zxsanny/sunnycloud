[package]
name = "sunnycloud-transfer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
sc_clock = { path = "../../shared/clock" }
sc_config = { path = "../../shared/config" }
sc_db = { path = "../../shared/db" }
sc_error = { path = "../../shared/error" }
sc_ids = { path = "../../shared/ids_hashing" }
sc_names = { path = "../../shared/names" }
sc_observability = { path = "../../shared/observability" }
# `stage_small` hands its verified body to the writer as a one-piece stream; the versions `contracts` uses.
bytes = { workspace = true }
futures-core = { version = "0.3", default-features = false }
# The repository modules run their statements on the transaction's connection; same features as sc_db.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The real tree reader and `publish` (02), blob writer, reader, registry and GC queue (04) and quota ledger (07a)
# of the upload and commit tests (component dev-dependencies, ADR-015).
sunnycloud-tree = { path = "../02_tree" }
sunnycloud-blobstore = { path = "../04_blobstore" }
sunnycloud-quota = { path = "../07a_quota" }
# The real feed stamp and notifier (05) that 02's `publish` calls last in `commit_upload` tests.
sunnycloud-sync-feed = { path = "../05_sync_feed" }
# The audit writer the real 04 keyring takes.
sc_audit = { path = "../../shared/audit" }
# Per-test PostgreSQL databases.
sc_testdb = { path = "../../shared/testdb" }
# The boundary-backed `AccountGuard` double (AZ-4250).
sunnycloud-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true, features = ["v4"] }
