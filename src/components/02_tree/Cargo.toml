[package]
name = "sunnycloud-tree"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { path = "../../contracts" }
sc_config = { path = "../../shared/config" }
sc_db = { path = "../../shared/db" }
sc_error = { path = "../../shared/error" }
# Name rules and the case-insensitive key (helper 06), the injected clock (helper 03, no SQL now()), ids.
sc_names = { path = "../../shared/names" }
sc_clock = { path = "../../shared/clock" }
sc_ids = { path = "../../shared/ids_hashing" }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Per-test PostgreSQL databases.
sc_testdb = { path = "../../shared/testdb" }
# The real feed stamp, notifier and page reader (05) that the mutations and `publish` call last.
sunnycloud-sync-feed = { path = "../05_sync_feed" }
# The real quota ledger (07a) of `publish` and the real `BlobRegistry::mark_committed_in_tx` (04) of the blob
# test effect (component dev-dependencies, ADR-015).
sunnycloud-quota = { path = "../07a_quota" }
sunnycloud-blobstore = { path = "../04_blobstore" }
# The vault erase hook (20) that runs before the tree's in the account purge (AZ-3925 AC-4).
sunnycloud-vault-service = { path = "../20_vault_service" }
# The statement-order test reads sqlx's statement events.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
