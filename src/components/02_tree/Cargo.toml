[package]
name = "sunnycloud-tree"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The janitors' WARN and INFO lines.
sc_observability = { path = "../../shared/observability" }
contracts = { path = "../../contracts" }
sc_config = { path = "../../shared/config" }
sc_db = { path = "../../shared/db" }
sc_error = { path = "../../shared/error" }
# Name rules and the case-insensitive key (helper 06), the injected clock (helper 03, no SQL now()), ids.
sc_names = { path = "../../shared/names" }
sc_clock = { path = "../../shared/clock" }
sc_ids = { path = "../../shared/ids_hashing" }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-none", "uuid"] }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# Per-test PostgreSQL databases.
sc_testdb = { path = "../../shared/testdb" }
# The boundary-backed `AccountGuard` double (AZ-4250).
sunnycloud-testkit = { path = "../testkit" }
# The real feed stamp, notifier and page reader (05) that the mutations and `publish` call last.
sunnycloud-sync-feed = { path = "../05_sync_feed" }
# The real quota ledger (07a) of `publish` and the real `BlobRegistry::mark_committed_in_tx` (04) of the blob
# test effect (component dev-dependencies, ADR-015).
sunnycloud-quota = { path = "../07a_quota" }
sunnycloud-blobstore = { path = "../04_blobstore" }
# The vault erase hook (20) that runs before the tree's in the account purge (AZ-3925 AC-4).
sunnycloud-vault-service = { path = "../20_vault_service" }
# The integration pass (AZ-3720): the real 01 guard and account admin, the real 03 commit effects through
# `PgUploadService`, the real 08 media effect, thumbnail source and output store; 04's keyring takes the audit
# writer, and the claim names its lane from `media-shared`.
sunnycloud-identity = { path = "../01_identity" }
sunnycloud-transfer = { path = "../03_transfer" }
media-api = { path = "../08_media_jobs" }
media-shared = { path = "../../media-shared" }
sc_audit = { path = "../../shared/audit" }
# Request bodies of `stage_small`, `put_block` and `accept_output` (`ByteStream`); the declarations of 03 and 08.
bytes = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# The statement-order test reads sqlx's statement events.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
