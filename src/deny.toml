[advisories]
yanked = "deny"
# Each entry: { id = "RUSTSEC-YYYY-NNNN", reason = "added=YYYY-MM-DD; expires=YYYY-MM-DD; why=..." }
# scripts/ci/audit.sh reads this list; there is no second one.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "added=2026-11-06; expires=2027-02-04; why=rsa (Marvin timing side channel, no patched version) enters through openidconnect, which uses it only to verify id-token signatures with the issuer's public key; no private-key operation runs in sunnycloud" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "Zlib",
    # ring, rustls-webpki and untrusted (the TLS stack of sync-core's HTTP client).
    "ISC",
]
# Only rustls-platform-verifier's wasm32 target pulls it (the Mozilla root bundle); no shipped host target links it.
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]
private = { ignore = true }

[bans]
multiple-versions = "warn"
deny = [
    { crate = "tokio:<1.54.1" },
    { crate = "h2:<0.4.16" },
    { crate = "bytes:<1.11.1" },
    { crate = "rustls:<0.23.45" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
