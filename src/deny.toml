[advisories]
yanked = "deny"
# Each entry: { id = "RUSTSEC-YYYY-NNNN", reason = "added=YYYY-MM-DD; expires=YYYY-MM-DD; why=..." }
# scripts/ci/audit.sh reads this list; there is no second one.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
deny = [
    { crate = "tokio:<1.54.1" },
    { crate = "h2:<0.4.16" },
    { crate = "bytes:<1.11.1" },
    { crate = "rustls:<0.23.45" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
