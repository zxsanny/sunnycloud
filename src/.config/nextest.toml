# cargo nextest runs every test in its own process and runs the tests of all test binaries side by side, so a test
# cannot lean on an in-process lock to keep another test of its binary away.

[profile.default]
# A hung test is stopped and reported after 10 minutes instead of holding the job until its timeout.
slow-timeout = { period = "60s", terminate-after = 10 }

# The free-space floor tests measure the free bytes of the shared filesystem and set their floor from them (they take
# a lock for it inside their binary), so nothing else may write while they run.
[[profile.default.overrides]]
filter = "binary(volume_floor)"
threads-required = "num-test-threads"

# Tests that assert a wall-clock bound on product code (a transaction under a second, a not-found answer under 25 ms,
# an idle purger cycle under 100 ms, a blob write acknowledged in 20 ms, a 400-iteration race under a minute, a purger cycle that must reach its second hook within its time budget) run alone, so other tests starving the CPUs
# cannot break the bound.
[[profile.default.overrides]]
filter = "test(it_07_11_cycles_stop_at_the_budget) | test(a_token_that_is_not_a_live_password_link) | test(it_07_13_cycles_with_no_deleting_account_write_nothing_and_return_quickly) | test(a_move_racing_an_edit_inside_always_leaves_the_edit_in_the_moved_folder) | test(an_uncontended_write_is_acknowledged_within_twenty_milliseconds) | test(at_07_1_a_deleted_account_leaves_nothing_behind_after_a_purger_restart_mid_cycle)"
threads-required = "num-test-threads"
