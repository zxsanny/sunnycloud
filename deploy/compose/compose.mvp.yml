# MVP stack on one Linux host: Postgres 18 and Caddy in Docker; api, worker and decoder run as host processes
# (scripts/dev/mvp-up.sh). Runbook: _docs/04_deploy/mvp_runbook.md.
#   scripts/dev/mvp-secrets.sh      creates ../../secrets-dev (gitignored)
#   scripts/dev/mvp-up.sh           starts everything
# Variables (all optional): PUBLIC_HOST, ACME_CA, ACME_EMAIL_LINE, WEB_DIST, MVP_DB_PORT.
name: sunnycloud-mvp

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

secrets:
  postgres_password: { file: ../../secrets-dev/postgres_password }
  db_api_url: { file: ../../secrets-dev/db_api_url }
  db_migrator_url: { file: ../../secrets-dev/db_migrator_url }

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}

services:
  db:
    image: postgres:18-trixie@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: sunnycloud
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, db_migrator_url, db_api_url]
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MVP_DB_PORT:-5532}:5432"
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunnycloud -d sunnycloud"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Host network: the proxy reaches the API on 127.0.0.1:8080 and owns host ports 80 and 443 (HTTP-01 needs 80).
  # No 443/udp: HTTP/3 is off. The admin API is off in the Caddyfile.
  caddy:
    image: caddy:2@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    network_mode: host
    restart: unless-stopped
    logging: *logging
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-drive.zxsanny.com}
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
      ACME_EMAIL_LINE: ${ACME_EMAIL_LINE:-}
    cap_drop: [ALL]
    # DAC_READ_SEARCH: the Caddyfile and the web bundle belong to the host user and are not world-readable
    # (umask 007 here), which a root without DAC_OVERRIDE could not read. Read access only.
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile.mvp:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${WEB_DIST:-../../src/web/dist}
        target: /srv/web
        read_only: true
        bind: { create_host_path: false }
      - caddy_data:/data
      - caddy_config:/config
